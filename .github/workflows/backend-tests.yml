# 文件版本：V0.02
name: backend-tests
# 后端全量单测（第 73 条，EV-07c-15）：PR 到 main 时在 GitHub ubuntu runner 上起 PostgreSQL 服务容器（与 160 complex-postgres 同一镜像摘要），
# 用现有入口 node tools/run-backend-maven.mjs 跑 backend 全部测试（Flyway 全迁 + 真库集成测试）。
# 只在 PR 上、且后端相关路径变化时触发，不随 push main 重跑；同分支新推送取消旧运行。
# 私有库免费版设不了必需检查（2026-11-11 第十八批裁决 48 定不升级、不公开）；ops/160/merge-pr.sh 自 V0.03 起对本提交触发了的本工作流也等绿才合并。
# 库账号与口令是仓内测试本就写着的开发默认值（application.yml 与各测试类同值），不引用任何 secrets。
on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "docs/openapi/**" # ConcurrentCountAutoResetJdbcIntegrationTests 读 ../docs/openapi/openapi-p0.json
      - "tools/run-backend-maven.mjs"
      - ".github/workflows/backend-tests.yml"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  TZ: America/Los_Angeles # 对齐 160 跑绿时的 JVM 时区
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: complex
          POSTGRES_PASSWORD: complex_dev_pwd
          POSTGRES_DB: complex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U complex -d complex_test"
          --health-interval 5s
          --health-retries 20
    env:
      # 测试类多数写死 complex_test；4 个 @SpringBootTest 走 application.yml 默认库、M006StoredValueJdbcTests 读这三个变量，须导出
      COMPLEX_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/complex_test
      COMPLEX_DATABASE_USERNAME: complex
      COMPLEX_DATABASE_PASSWORD: complex_dev_pwd
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1（AUD-068：固定完整 commit SHA，防可变标签漂移）
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1（同上）
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: 后端全量测试
        run: node tools/run-backend-maven.mjs -B -ntp test
