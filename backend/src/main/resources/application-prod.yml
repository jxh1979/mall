server:
  address: ${COMPLEX_API_HOST:127.0.0.1}

logging:
  level:
    root: INFO
    com.complex.platform: INFO

spring:
  # 生产 append-only 硬强制（V140）：运行时连接改用受限角色 complex_app（被 REVOKE 掉 append-only 表的 UPDATE/DELETE，
  # 且无 DDL 权限，无法 DROP 触发器 / SET session_replication_role 绕过）；Flyway 仍以 owner 身份跑 DDL/迁移。
  # 运维须先 ALTER ROLE complex_app PASSWORD '...' 并下发 COMPLEX_DATABASE_APP_PASSWORD。
  # 默认回退到 owner 凭证（未配置 app 专用 env 时行为不变，向后兼容）；
  # 运维配置 COMPLEX_DATABASE_APP_USERNAME/PASSWORD 后即启用受限运行时连接。
  # 3.4 生产 fail-closed：ProductionDatabaseCredentialGuard（prod profile）强制 app≠owner 且不得为 dev 默认
  #   （complex/complex_dev_pwd），违反即启动失败；确需以共享 dev 角色跑 prod-profile 测试时用
  #   complex.database.credential-separation.enforced=false 显式豁免。
  datasource:
    username: ${COMPLEX_DATABASE_APP_USERNAME:${COMPLEX_DATABASE_USERNAME:complex}}
    password: ${COMPLEX_DATABASE_APP_PASSWORD:${COMPLEX_DATABASE_PASSWORD:complex_dev_pwd}}
  flyway:
    user: ${COMPLEX_DATABASE_OWNER_USERNAME:${COMPLEX_DATABASE_USERNAME:complex}}
    password: ${COMPLEX_DATABASE_OWNER_PASSWORD:${COMPLEX_DATABASE_PASSWORD:complex_dev_pwd}}

# AUD-033 配套(HTML冲突复核用户拍板): 承接业务全景图强制"系统自动"的定时作业, prod开启;
# 企微会话留存(compliance.wecom-retention)按用户选择保持默认关。
ticket.order.expiry.scheduled.enabled: true
settlement.expiry.scheduled.enabled: true
settlement.reconciliation.scheduled.enabled: true
settlement.monthly.scheduled.enabled: true
customer.loyalty.scheduled.enabled: true
governance.supervisor-review.escalation.scheduled.enabled: true
ticket.face-photo.purge.scheduled.enabled: true
analytics.dashboard-etl.scheduled.enabled: true
amusement.inspection-task.scheduled.enabled: true
merchant.service.sla-escalation.scheduled.enabled: true

# 2026-07-21 补齐生产漏配的定时作业(兄弟作业已开·这3个漏配;存量backlog=0/内部,首跑无客人可见影响):
facility.inspection.scheduled.enabled: true                  # 设施定期巡检自动生成(游乐巡检amusement.inspection-task已开·此为漏配→防漏检)
voucher.reservation.expiry.scheduled.enabled: true           # 实物券过期预占库存自动释放(防冻结量单调累积挡合法发券)
inventory.saved-bottle.notification.scheduled.enabled: true  # 存酒到期状态自动流转+临期提醒(真发短信另需供应商适配器)

# 2026-08-02 合同到期批转接线(旧 governance ContractExpiryJob 删除后调用方缺位→过期合同停留 effective,变更/结算入口照常放行):
contract.expiry.scheduled.enabled: true                      # 合同过 expiry_date 日度批转 effective→expired(审计事件 contract.expired_batch)

# 2026-09-24 M001-F03(PGM 权限规则「到期自动失效」「到期……全部留痕」):无人读取权限时模板套用也按时置 expired 并留痕
access.permission-expiry.scheduled.enabled: true

# AUD-010: web 通道翻 enforce——拒「Authorization: Bearer 自报 web」走资金端点旁路
# (合法后台走 Cookie 会话·无客户端依赖·可独立翻;设备绑定型/app 仍 grace 待 BYOD二期客户端签名)
access.device_credential.enforcement.web: enforce
