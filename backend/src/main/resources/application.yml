server:
  port: ${COMPLEX_API_PORT:8080}
  address: ${COMPLEX_API_HOST:127.0.0.1}
  # TLS 终止反代场景：让 request.isSecure()/scheme 采信 X-Forwarded-* 头，从而正确判定 HTTPS（客人会话 cookie 的 Secure 标记依赖于此）。
  forward-headers-strategy: framework

spring:
  application:
    name: complex-api
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    property-naming-strategy: SNAKE_CASE
  profiles:
    default: local
  datasource:
    url: ${COMPLEX_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/complex}
    username: ${COMPLEX_DATABASE_USERNAME:complex}
    password: ${COMPLEX_DATABASE_PASSWORD:complex_dev_pwd}
    hikari:
      maximum-pool-size: ${COMPLEX_DATABASE_POOL_SIZE:10}
      minimum-idle: ${COMPLEX_DATABASE_MIN_IDLE:2}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

springdoc:
  api-docs:
    path: /docs/openapi
  swagger-ui:
    path: /docs/swagger-ui
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

complex:
  app:
    name: complex-api
    version: ${COMPLEX_API_VERSION:0.1.0}
    build-time: ${COMPLEX_API_BUILD_TIME:local}
  auth:
    master:
      # U 盘破窗（最终验证器）登录公钥（Ed25519 SPKI base64）。默认空=功能关闭；
      # 由 U 盘安装期 provision 写入 env COMPLEX_MASTER_AUTHORITY_PUBKEY 后启用。私钥永不落服务器，只在 U 盘。
      public-key: ${COMPLEX_MASTER_AUTHORITY_PUBKEY:}
      challenge-ttl: ${COMPLEX_MASTER_CHALLENGE_TTL:PT2M}

finance:
  # 经营日切时点（小时, 0-23），凌晨该点切自然日。财务确认默认 04:00。
  # 此前的流水归前一经营日；T7 日结六源汇总与 T12 看板 ETL 统一按此分桶。
  business-day-cutoff-hour: ${COMPLEX_BUSINESS_DAY_CUTOFF_HOUR:4}

ticket:
  credential:
    signing:
      # P0-3/X-01 门票二维码 HMAC 签名密钥（业务HTML business-system-map:692-693「二维码必须带签名」）。
      # 生产必须由 env COMPLEX_TICKET_SIGNING_SECRET 注入强随机密钥；下方 dev 默认仅供本地/测试，切勿用于生产
      # （核销端按相同密钥校验，密钥泄漏即可伪造合法二维码签名）。
      secret: ${COMPLEX_TICKET_SIGNING_SECRET:complex-dev-ticket-signing-secret-change-me}
      # 签名密钥版本，写入 ticket_credentials.signature_version，为后续密钥轮转预留。
      version: ${COMPLEX_TICKET_SIGNING_VERSION:v1}

bar:
  pos:
    image:
      # V256 图形化点单 POS 商品/套餐图片本地存储目录（同 image_url 先例，不上云）。
      # 生产可由 env COMPLEX_BAR_POS_IMAGE_DIR 指向持久化卷；dev 默认相对工作目录。
      dir: ${COMPLEX_BAR_POS_IMAGE_DIR:./data/bar-images}
  invitation:
    signing:
      # V155 订卡邀请函二维码 HMAC 签名密钥。
      # 生产必须由 env COMPLEX_BAR_INVITATION_SIGNING_SECRET 注入强随机密钥；下方 dev 默认仅供本地/测试，切勿用于生产。
      secret: ${COMPLEX_BAR_INVITATION_SIGNING_SECRET:complex-dev-bar-invitation-secret-change-me}

compliance:
  wecom:
    webhook:
      signing:
        # 企微 webhook 回调 HMAC 验签密钥（AUD 复核 P1-2 新增）。生产必须由 env COMPLEX_WECOM_WEBHOOK_SIGNING_SECRET
        # 注入强随机密钥；下方 dev 默认仅供本地/测试，切勿用于生产（SigningSecretGuard 在 prod 对弱/默认值 fail-closed）。
        secret: ${COMPLEX_WECOM_WEBHOOK_SIGNING_SECRET:complex-dev-wecom-webhook-secret-change-me}

keyvault:
  keys:
    # PII 字段加密密钥（AES-256-GCM，经 SHA-256 派生 32 字节）。安装期由 U 盘 provision 写入本地/环境，
    # 运行态只读本地、不依赖 U 盘（模型①）。生产必须由 env COMPLEX_KEYVAULT_PII_KEY 注入强随机密钥
    # （>=32 且不含 change-me，否则 prod 启动即 fail-closed）；下方 dev 默认仅供本地/测试，切勿用于生产。
    pii: ${COMPLEX_KEYVAULT_PII_KEY:complex-dev-pii-encryption-key-change-me}
    # PII 盲索引密钥（HMAC-SHA256，与 pii 加密密钥分离）。生产由 env 注入强随机（>=32 且不含 change-me）。
    pii-index: ${COMPLEX_KEYVAULT_PII_INDEX_KEY:complex-dev-pii-blind-index-key-change-me}
