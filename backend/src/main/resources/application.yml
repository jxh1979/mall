server:
  port: ${COMPLEX_API_PORT:8080}
  address: ${COMPLEX_API_HOST:127.0.0.1}

spring:
  application:
    name: complex-api
  jackson:
    property-naming-strategy: SNAKE_CASE
  profiles:
    default: local
  datasource:
    url: ${COMPLEX_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/complex}
    username: ${COMPLEX_DATABASE_USERNAME:complex}
    password: ${COMPLEX_DATABASE_PASSWORD:complex_dev_pwd}
    hikari:
      maximum-pool-size: ${COMPLEX_DATABASE_POOL_SIZE:10}
      minimum-idle: ${COMPLEX_DATABASE_MIN_IDLE:2}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

springdoc:
  api-docs:
    path: /docs/openapi
  swagger-ui:
    path: /docs/swagger-ui
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

complex:
  app:
    name: complex-api
    version: ${COMPLEX_API_VERSION:0.1.0}
    build-time: ${COMPLEX_API_BUILD_TIME:local}
