# 集成/切片测试关闭应用层限速：MockMvc 全部共享 remoteAddr(127.0.0.1)，且上下文缓存令多个测试类
# 共用同一 RateLimiter 实例，逐请求在同一固定窗口内累计易误触 429。限速行为由
# RateLimiterTest / RateLimitInterceptorTest 直接构造组件证明，不依赖此开关。
# 仅 src/test/resources 生效；dev/prod 交付物不含本文件，complex.rate-limit.enabled 取默认 true 保持开启。
complex.rate-limit.enabled=false
# 第 23 条 23-R3：导出密码密钥的测试值（prod 档测试拒绝 change-me 默认值；仅 src/test/resources 生效，生产由 COMPLEX_EXPORT_PASSWORD_SECRET 注入）。
security.export.password-secret=test-export-password-secret-32-bytes-minimum
